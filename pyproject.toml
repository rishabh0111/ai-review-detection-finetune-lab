[project]
name = "rd"
version = "0.1.0"
description = "Real or AI? Fine-tuning models to catch AI-written fake reviews"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
